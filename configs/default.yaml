# Default model and pipeline configuration
# All values are read at runtime — do not hardcode in source files.

model:
  name: "crnn"
  input_height: 128           # Image height after preprocessing (px)
  input_channels: 1           # Grayscale

  # CNN feature extractor
  cnn_channels: [32, 64, 128, 256]   # Output channels per conv block
  cnn_kernel_size: 3                 # Kernel size for all conv layers
  cnn_dropout: 0.1                   # Dropout after each conv block

  # BiLSTM sequence model
  rnn_hidden: 256             # Hidden units per LSTM direction
  rnn_layers: 2               # Number of stacked BiLSTM layers
  rnn_dropout: 0.3            # Dropout between LSTM layers (>1 layer only)

dataset:
  # HuggingFace datasets local cache directory.
  # null → uses the default: ~/.cache/huggingface/datasets/
  # The dataset is downloaded once on first run and reused locally.
  # Do NOT point this inside the repository directory.
  cache_dir: null

preprocessing:
  target_height: 128          # Fixed height; width scales proportionally
  mean: 0.5                   # Normalisation mean (grayscale single-channel)
  std: 0.5                    # Normalisation std  (grayscale single-channel)
  augmentation:
    enabled: false            # Disabled, baseline performs better
    rotation_degrees: 2       # Small rotation (-2 to 2 degrees)
    shear_degrees: 5          # Mild shear (-5 to 5 degrees)
    brightness_jitter: 0.2    # Mild brightness shift
    contrast_jitter: 0.2      # Mild contrast shift
    noise_std: 0.05           # Mild Gaussian noise standard deviation

tokenizer:
  blank_token: "<BLANK>"      # CTC blank — always assigned index 0
  unknown_token: "<UNK>"      # Fallback for unseen characters

training:
  # ── Core hyperparameters ──────────────────────────────────────────
  batch_size: 8               # Small — IAM line images are very wide
  learning_rate: 5.0e-4
  weight_decay: 1.0e-4
  max_epochs: 15              # Practical baseline on Apple Silicon
  grad_clip: 5.0              # Max gradient L2 norm for clipping
  num_workers: 0              # 0 = main process; safe for MPS
  random_seed: 42

  # ── Device ───────────────────────────────────────────────────────
  device: "auto"              # "auto" = cuda > mps > cpu; or set explicitly

  # ── Dataset caps (null = use full split) ─────────────────────────
  max_train_samples: null     # Set to integer to cap training set size
  max_val_samples: null       # Set to integer to cap validation set size

  # ── Checkpointing ─────────────────────────────────────────────────
  checkpoint_dir: "checkpoints"   # Directory for saved checkpoints

  # ── Legacy smoke-training subset (quick pipeline verification) ────
  smoke_train_samples: 200
  smoke_val_samples: 50
  smoke_epochs: 1

evaluation:
  metrics:
    - cer
    - wer

inference:
  checkpoint: null            # Path to model checkpoint (.pt)
  device: "auto"
